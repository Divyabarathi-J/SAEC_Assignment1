<!DOCTYPE html>
<html>
<head>
    <title>DoodleBlue Registration</title>
    <style>  
    .show
    {
        color:blue
    }  
    .hide
    {
        color:red
    }
    </style>

    
</head>
<body>
    <button id="show"> show </button>
    <label id="showlabel"></label>

    <script>
        //console.log("Hello World")
        var boolean; 
        const button = document.getElementById("show");
        const label = document.getElementById("showlabel");
        button.addEventListener('click', function()
    {
        boolean = !boolean;
        label.textContent = `${boolean?"Label is Shown":"Label is Hidden"}`
        label.className = `${boolean? "show":"hide"}`
    })

    </script>






</body>


</html>
